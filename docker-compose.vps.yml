# Overlay de despliegue para VPS / Producción sobre docker-compose.yml.
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
# Con HTTPS automático (Caddy + Let's Encrypt):
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml --profile tls up -d

x-vps-logging: &vps_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    restart: unless-stopped
    logging: *vps_logging

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      APP_NAME: ${APP_NAME:-SPS API}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
      PARTICIPATION_TIMESTAMP_ZONE: ${PARTICIPATION_TIMESTAMP_ZONE:?Configure PARTICIPATION_TIMESTAMP_ZONE según la convención histórica}
    depends_on:
      db:
        condition: service_healthy
    logging: *vps_logging

  api:
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2} --proxy-headers --forwarded-allow-ips=*
    volumes:
      - ./deploy/vps/trust:/etc/sps/trust:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *vps_logging

  worker:
    restart: unless-stopped
    environment:
      PARTICIPATION_TIMESTAMP_ZONE: ${PARTICIPATION_TIMESTAMP_ZONE:?Configure PARTICIPATION_TIMESTAMP_ZONE según la convención histórica}
      ACADEMIC_RUNTIME_SCOPE: ${ACADEMIC_RUNTIME_SCOPE:-}
      IDENTITY_CONSENT_APPROVAL_MANIFEST: ${IDENTITY_CONSENT_APPROVAL_MANIFEST:-}
      IDENTITY_CONSENT_APPROVAL_SHA256: ${IDENTITY_CONSENT_APPROVAL_SHA256:-}
      IDENTITY_CONSENT_APPROVAL_PUBLIC_KEY: ${IDENTITY_CONSENT_APPROVAL_PUBLIC_KEY:-}
      PARTICIPATION_START_POLICY_FILE: ${PARTICIPATION_START_POLICY_FILE:-}
      PARTICIPATION_START_POLICY_SHA256: ${PARTICIPATION_START_POLICY_SHA256:-}
    volumes:
      - ./deploy/vps/trust:/etc/sps/trust:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from sqlalchemy import text; from app.db.session import get_engine; get_engine().connect().execute(text('SELECT 1'))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *vps_logging

  frontend:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *vps_logging

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SPS_DOMAIN: ${SPS_DOMAIN:-localhost}
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    logging: *vps_logging

volumes:
  caddy_data:
  caddy_config:
