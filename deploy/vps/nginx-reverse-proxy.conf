# Configuración de referencia para Nginx instalado en el host Linux del VPS
# (alternativa al perfil Caddy cuando el servidor ya administra Certbot/Nginx).
#
# 1. Copiar a /etc/nginx/sites-available/sps.conf reemplazando sps.tudominio.edu.co
# 2. Enlazar en /etc/nginx/sites-enabled/sps.conf y validar con: sudo nginx -t
# 3. Emitir certificado Let's Encrypt: sudo certbot --nginx -d sps.tudominio.edu.co

server {
    listen 80;
    server_name sps.tudominio.edu.co;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sps.tudominio.edu.co;

    # Certbot completará estas rutas automáticamente al ejecutarse:
    ssl_certificate /etc/letsencrypt/live/sps.tudominio.edu.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sps.tudominio.edu.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
