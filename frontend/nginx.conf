map "$request_method:$uri" $sps_auth_limit {
    default "";
    ~^POST:/api/v1/identity/auth/ $binary_remote_addr;
}

limit_req_zone $sps_auth_limit zone=sps_auth:1m rate=60r/m;

upstream sps_api {
    zone sps_api 64k;
    # Docker actualiza la dirección del servicio cuando se recrea el contenedor.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    server api:8000 resolve;
}

map "$status:$uri" $sps_cache_control {
    default "";
    ~^429: "no-store";
    ~^\d+:/index\.html$ "no-cache";
    "~^(200|206|304):/[^/]+-[A-Z0-9]{8}\.(js|css)$" "public, max-age=31536000, immutable";
}

map $status $sps_retry_after {
    default "";
    429 1;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 4m;

    root /usr/share/nginx/html;
    index index.html;
    limit_req zone=sps_auth burst=24 nodelay;
    limit_req_status 429;
    error_page 429 = @sps_auth_limit_exceeded;

    add_header Cache-Control $sps_cache_control always;
    add_header Retry-After $sps_retry_after always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; media-src 'self' blob:" always;

    location @sps_auth_limit_exceeded {
        default_type application/json;
        return 429 '{"detail":"Demasiadas solicitudes de acceso. Espera un momento e inténtalo de nuevo."}';
    }

    # Compresión gzip para alto rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Enrutamiento SPA Angular
    location ~ "^/[^/]+-[A-Z0-9]{8}\.(js|css)$" {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend modular FastAPI
    location ~ ^/(api/|scheduling/|health$|ready$) {
        proxy_pass http://sps_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }
}

