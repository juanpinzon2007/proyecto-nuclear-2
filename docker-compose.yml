services:
  api:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-SPS API}
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:-}
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-sps-api}
      IDENTITY_JWT_AUDIENCE: ${IDENTITY_JWT_AUDIENCE:-sps}
      IDENTITY_JWT_MINUTES: ${IDENTITY_JWT_MINUTES:-15}
      IDENTITY_INSTITUTIONAL_DOMAINS: "${IDENTITY_INSTITUTIONAL_DOMAINS:-[]}"
      PARTICIPATION_TIMESTAMP_ZONE: ${PARTICIPATION_TIMESTAMP_ZONE:?Configure PARTICIPATION_TIMESTAMP_ZONE según la convención histórica}
      ACADEMIC_RUNTIME_SCOPE: ${ACADEMIC_RUNTIME_SCOPE:-}
      IDENTITY_CONSENT_APPROVAL_MANIFEST: ${IDENTITY_CONSENT_APPROVAL_MANIFEST:-}
      IDENTITY_CONSENT_APPROVAL_SHA256: ${IDENTITY_CONSENT_APPROVAL_SHA256:-}
      IDENTITY_CONSENT_APPROVAL_PUBLIC_KEY: ${IDENTITY_CONSENT_APPROVAL_PUBLIC_KEY:-}
      PARTICIPATION_START_POLICY_FILE: ${PARTICIPATION_START_POLICY_FILE:-}
      PARTICIPATION_START_POLICY_SHA256: ${PARTICIPATION_START_POLICY_SHA256:-}
      SCHEDULING_MAIL_ENABLED: ${SCHEDULING_MAIL_ENABLED:-false}
      SCHEDULING_MAIL_HOST: ${SCHEDULING_MAIL_HOST:-}
      SCHEDULING_MAIL_PORT: ${SCHEDULING_MAIL_PORT:-}
      SCHEDULING_MAIL_TLS: ${SCHEDULING_MAIL_TLS:-}
      SCHEDULING_MAIL_FROM: ${SCHEDULING_MAIL_FROM:-}
      SCHEDULING_MAIL_USERNAME: ${SCHEDULING_MAIL_USERNAME:-}
      SCHEDULING_MAIL_PASSWORD: ${SCHEDULING_MAIL_PASSWORD:-}
      SCHEDULING_MAIL_ENCRYPTION_KEY: ${SCHEDULING_MAIL_ENCRYPTION_KEY:-}
      SCHEDULING_MAIL_PUBLIC_URL: ${SCHEDULING_MAIL_PUBLIC_URL:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_DB: sps_test
      POSTGRES_USER: sps
      POSTGRES_PASSWORD: test

    # Solo pruebas: datos en RAM y sin fsync; se pierden al detener el contenedor.
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sps -d sps_test"]
      interval: 3s
      timeout: 3s
      retries: 10
  worker:
    build:
      context: ./backend
    command:
      - python
      - -m
      - app.modules.scheduling.infrastructure.worker_runner
    profiles:
      - worker
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
